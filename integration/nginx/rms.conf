# =============================================================================
# Nginx config for the RMS EC2 host
# -----------------------------------------------------------------------------
#  1. rms.example.org         -> existing windows-rms-server (UNCHANGED for clients)
#       /softwares/<file>     -> now served from S3/R2 (same URL the clients already use)
#                                with automatic fallback to the old EC2 disk folder
#  2. software.rms.example.org -> the new Software Portal (UI + /api/admin)
#
# Replace: rms.example.org, software.rms.example.org, BUCKET HOST, ports, cert paths.
# Test:    sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Upstream bucket host. Pick ONE:
#   AWS S3 (virtual-hosted):  rms-softwares.s3.ap-south-1.amazonaws.com
#   CloudFront in front of S3: d1234abcd.cloudfront.net
#   Cloudflare R2 public bucket custom domain: files.rms.example.org
map $host $rms_bucket_host { default "rms-softwares.s3.ap-south-1.amazonaws.com"; }

# Keep only installer-like file names; everything else under /softwares/ is a 404.
map $uri $rms_valid_software_path {
    default 0;
    "~^/softwares/[A-Za-z0-9][A-Za-z0-9._-]{0,200}\.(exe|msi|bat|cmd|ps1|zip)$" 1;
}

# Optional local cache of installers on the EC2 disk: hot installers are fetched from
# the bucket once and then served locally (useful when hundreds of laptops pull the same
# 500 MB file in the same hour). Comment out the two proxy_cache lines below to disable.
proxy_cache_path /var/cache/nginx/rms-softwares levels=1:2 keys_zone=rms_softwares:20m
                 max_size=20g inactive=7d use_temp_path=off;

server {
    listen 443 ssl http2;   # nginx >= 1.25.1 prefers: listen 443 ssl; http2 on;
    server_name rms.example.org;
    ssl_certificate     /etc/letsencrypt/live/rms.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rms.example.org/privkey.pem;

    # AWS VPC DNS resolver (use 1.1.1.1 / 8.8.8.8 outside AWS). Needed because
    # proxy_pass uses a variable, so the bucket hostname is re-resolved periodically.
    resolver 169.254.169.253 valid=60s ipv6=off;
    resolver_timeout 5s;

    # ---------------------------------------------------------------------
    # Software binaries: ${BACKEND_BASE_URL}/softwares/<winget_id>
    # The client URL does not change. Object key in the bucket = "softwares/<file>".
    # ---------------------------------------------------------------------
    location ^~ /softwares/ {
        if ($rms_valid_software_path = 0) { return 404; }
        limit_except GET HEAD { deny all; }

        proxy_pass              https://$rms_bucket_host;   # passes $uri as-is -> key softwares/<file>
        proxy_set_header        Host $rms_bucket_host;
        proxy_ssl_server_name   on;
        proxy_ssl_name          $rms_bucket_host;
        proxy_http_version      1.1;
        proxy_set_header        Connection "";
        proxy_set_header        Authorization "";           # never forward client credentials
        proxy_set_header        Cookie "";
        proxy_hide_header       Set-Cookie;
        proxy_hide_header       x-amz-id-2;
        proxy_hide_header       x-amz-request-id;
        proxy_hide_header       x-amz-meta-server-side-encryption;
        proxy_hide_header       x-amz-server-side-encryption;
        proxy_ignore_headers    Set-Cookie;

        # Large installers: generous timeouts, Range passthrough for resumable downloads
        proxy_connect_timeout   10s;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;

        # Local cache (optional, see proxy_cache_path above)
        proxy_cache             rms_softwares;
        proxy_cache_valid       200 206 1h;
        proxy_cache_lock        on;                         # 300 laptops -> 1 bucket fetch
        proxy_cache_use_stale   error timeout updating;
        proxy_cache_key         $uri$http_range;
        add_header              X-Cache-Status $upstream_cache_status always;

        # Transition period: anything not yet in the bucket falls back to the
        # old EC2 disk folder served by windows-rms-server. S3 returns 403 for
        # missing keys when the caller cannot list the bucket, so treat 403 as 404.
        proxy_intercept_errors  on;
        error_page 403 404 = @legacy_softwares_disk;
    }

    location @legacy_softwares_disk {
        proxy_pass http://127.0.0.1:3000;                   # existing windows-rms-server
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # Everything else: existing RMS API exactly as before
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------------------------------------
# Software Portal (admin UI + /api/admin)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;   # nginx >= 1.25.1 prefers: listen 443 ssl; http2 on;
    server_name software.rms.example.org;
    ssl_certificate     /etc/letsencrypt/live/software.rms.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/software.rms.example.org/privkey.pem;

    # Installers go browser -> bucket directly, so API bodies stay tiny.
    client_max_body_size 2m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # connect-src must include the bucket's upload endpoint (presigned PUTs)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self' https://*.amazonaws.com https://*.r2.cloudflarestorage.com" always;

    # Optional: restrict the portal to office / VPN IPs
    # allow 203.0.113.0/24;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;   # "Verify checksum" re-hashes large files server-side
    }
}

server {
    listen 80;
    server_name rms.example.org software.rms.example.org;
    # IMPORTANT: if any deployed client uses http:// as BACKEND_BASE_URL, do NOT
    # redirect /softwares or /api for it. Copy the two /softwares locations
    # into this block instead of the redirect.
    return 301 https://$host$request_uri;
}
